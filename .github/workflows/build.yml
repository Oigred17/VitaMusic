name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build VitaMusic.vpk
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync TLS packages
        run: |
          vdpm pacman -Rdd --noconfirm openssl-1.1.1
          VDPM_NONINTERACTIVE=1 vdpm install --force openssl

      - name: Configure
        run: cmake -B build -G Ninja

      - name: Build
        run: cmake --build build

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VitaMusic.vpk
          path: build/VitaMusic.vpk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/VitaMusic.vpk
          generate_release_notes: true